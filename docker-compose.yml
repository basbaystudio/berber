# Yalnızca yerel geliştirme ve testler içindir. Canlı ortam: Vercel + Neon.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: berber
      POSTGRES_PASSWORD: berber
      POSTGRES_DB: berber
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
volumes:
  dbdata:
